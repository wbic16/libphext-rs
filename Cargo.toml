[package]
name = "libphext"
version = "0.4.2"
authors = ["Will Bickford <wbic16@gmail.com>"]
description = "The reference implementation of phext, in Rust."
homepage = "https://phext.io/"
license = "MIT"
edition = "2021"

[features]
default = []
binary = ["dep:base64"]
xz = ["dep:xz2"]

[dependencies]
xxhash-rust = { version = "0.8.5", features = ["xxh3"] }
base64 = { version = "0.22", optional = true }
xz2 = { version = "0.1", optional = true }
